services:
  server:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.10}
    restart: always
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads-data:/app/data/uploads
      - tfidf-indices:/app/data/indices
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host ${HOST:-0.0.0.0} --port ${PORT:-8000}

  worker:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.10}
    restart: always
    env_file: .env
    volumes:
      - uploads-data:/app/data/uploads
      - tfidf-indices:/app/data/indices
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info

  rag-service:
    build:
      context: ../rag-service
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.10}
    restart: always
    env_file: ../rag-service/.env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg15
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uploads-data:
  tfidf-indices:
  db-data:
  redis-data: